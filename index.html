<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blockbuster.NET</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
  <style>
    :root {
      --bg: #05070d;
      --panel: #0c111d;
      --line: #1b2540;
      --text: #d6e2ff;
      --dim: #6b7a9e;
      --cyan: #00e5ff;
      --magenta: #ff2bd6;
      --green: #39ff88;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 32px 16px;
      background:
        linear-gradient(rgba(0,229,255,.04) 1px, transparent 1px) 0 0 / 40px 40px,
        linear-gradient(90deg, rgba(0,229,255,.04) 1px, transparent 1px) 0 0 / 40px 40px,
        radial-gradient(circle at 50% -10%, #0f1c3d 0%, var(--bg) 60%);
      background-color: var(--bg);
      color: var(--text);
      font-family: ui-monospace, "JetBrains Mono", "Fira Code", Consolas, monospace;
    }
    .app {
      max-width: 640px; margin: 0 auto; padding: 28px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      box-shadow: 0 0 40px rgba(0,229,255,.08), inset 0 0 0 1px rgba(255,255,255,.02);
    }
    h1 {
      margin: 0; font-size: 1.9rem; letter-spacing: .08em; text-transform: uppercase;
      color: var(--cyan); text-shadow: 0 0 14px rgba(0,229,255,.6);
    }
    .owner { margin: 6px 0 24px; color: var(--dim); font-size: .85rem; }
    .owner b { color: var(--magenta); font-weight: 600; }
    form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    input[type=text], select {
      background: #080c16; color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 10px 12px; font: inherit; outline: none;
    }
    input[type=text] { flex: 1 1 200px; }
    input[type=text]:focus, select:focus {
      border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,229,255,.15);
    }
    button {
      cursor: pointer; font: inherit; border-radius: 8px; padding: 10px 16px;
      border: 1px solid var(--cyan); background: transparent; color: var(--cyan);
      text-transform: uppercase; letter-spacing: .06em; transition: .15s;
    }
    button:hover { background: var(--cyan); color: #000; box-shadow: 0 0 16px rgba(0,229,255,.5); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    li {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      background: #080c16; border: 1px solid var(--line); border-radius: 10px;
    }
    li:hover { border-color: rgba(0,229,255,.4); }
    input[type=checkbox] { accent-color: var(--green); width: 18px; height: 18px; cursor: pointer; }
    .nome { flex: 1; }
    .feito { text-decoration: line-through; color: var(--dim); }
    .tag {
      font-size: .7rem; padding: 2px 8px; border-radius: 999px; text-transform: uppercase;
      border: 1px solid var(--magenta); color: var(--magenta);
    }
    .tag.serie { border-color: var(--green); color: var(--green); }
    .remover { padding: 4px 10px; border-color: #ff4d6d; color: #ff4d6d; }
    .remover:hover { background: #ff4d6d; color: #000; box-shadow: 0 0 14px rgba(255,77,109,.5); }
    .vazio { text-align: center; color: var(--dim); padding: 28px 0; }
    .stats { margin-bottom: 20px; font-size: .8rem; color: var(--dim); }
    .barra { height: 6px; margin-top: 8px; background: #080c16; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
    .barra div { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--green)); box-shadow: 0 0 10px var(--cyan); transition: width .3s; }
    .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .filtros input[type=text] { flex: 1 1 140px; padding: 8px 10px; }
    .abas { display: flex; gap: 4px; }
    .abas button { padding: 6px 12px; font-size: .75rem; border-color: var(--line); color: var(--dim); }
    .abas button.ativa { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px rgba(0,229,255,.3); }
    .fav { padding: 2px 8px; border-color: transparent; color: var(--dim); font-size: 1rem; }
    .fav.on { color: #ffd23f; text-shadow: 0 0 10px rgba(255,210,63,.7); }
    .fav:hover { background: transparent; color: #ffd23f; box-shadow: none; }
    .dados { justify-content: flex-start; border-top: 1px dashed var(--line); padding-top: 16px; }
    .dica { position: relative; }
    .dica::after {
      content: attr(data-tip); white-space: pre-line; text-transform: none; letter-spacing: 0;
      position: absolute; left: 0; bottom: calc(100% + 10px); width: 280px; z-index: 10;
      padding: 10px 12px; text-align: left; font-size: .72rem; line-height: 1.5;
      background: #05070d; color: var(--text); border: 1px solid var(--cyan); border-radius: 8px;
      box-shadow: 0 0 18px rgba(0,229,255,.25);
      opacity: 0; pointer-events: none; transform: translateY(4px); transition: .15s;
    }
    .dica:hover::after, .dica:focus-visible::after { opacity: 1; transform: none; }
    @media (max-width: 520px) { .dica::after { width: 220px; } }
    .nota { display: flex; }
    .nota span { cursor: pointer; color: var(--line); font-size: .9rem; padding: 0 1px; }
    .nota span.on { color: var(--cyan); text-shadow: 0 0 8px rgba(0,229,255,.7); }
    .edit { flex: 1; padding: 4px 8px !important; }
    .nome { cursor: text; }
    .rodape { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 18px; flex-wrap: wrap; }
    .rodape button { font-size: .75rem; padding: 6px 12px; border-color: var(--line); color: var(--dim); }
    .rodape button:hover { border-color: var(--magenta); background: var(--magenta); color: #000; box-shadow: 0 0 14px rgba(255,43,214,.5); }
  </style>
</head>
<body>
  <div id="app" class="app">
    <h1>{{ titulo }}</h1>
    <p class="owner">// operador: <b>{{ autor }}</b></p>

    <form @submit.prevent="adicionar">
      <input type="text" v-model="novoNome" placeholder="Nome do filme ou série..." />
      <select v-model="novoTipo">
        <option value="Filme">Filme</option>
        <option value="Série">Série</option>
      </select>
      <button type="submit">Adicionar</button>
    </form>

    <template v-if="itens.length">
      <div class="stats">
        {{ totalAssistidos }} / {{ itens.length }} assistidos ({{ progresso }}%)
        <div class="barra"><div :style="{ width: progresso + '%' }"></div></div>
      </div>

      <div class="filtros">
        <input type="text" v-model="busca" placeholder="Buscar..." />
        <select v-model="filtroTipo">
          <option value="">Todos os tipos</option>
          <option value="Filme">Filmes</option>
          <option value="Série">Séries</option>
        </select>
        <div class="abas">
          <button v-for="a in abas" :key="a.valor" type="button"
                  :class="{ ativa: filtroStatus === a.valor }"
                  @click="filtroStatus = a.valor">{{ a.rotulo }}</button>
        </div>
        <select v-model="ordem">
          <option value="adicao">Ordem: adição</option>
          <option value="az">Ordem: A–Z</option>
          <option value="nota">Ordem: nota</option>
        </select>
      </div>

      <ul v-if="visiveis.length">
        <li v-for="item in visiveis" :key="item.id">
          <input type="checkbox" v-model="item.assistido" />
          <input v-if="editandoId === item.id" class="edit" type="text" v-model="editandoNome"
                 @keyup.enter="salvarEdicao(item)" @keyup.esc="editandoId = null"
                 @blur="salvarEdicao(item)" :ref="el => el && el.focus()" />
          <span v-else class="nome" :class="{ feito: item.assistido }" title="Duplo clique para editar"
                @dblclick="editar(item)">{{ item.nome }}</span>
          <span class="tag" :class="{ serie: item.tipo === 'Série' }">{{ item.tipo }}</span>
          <span class="nota" title="Nota">
            <span v-for="n in 5" :key="n" :class="{ on: n <= item.nota }"
                  @click="item.nota = item.nota === n ? 0 : n">★</span>
          </span>
          <button class="fav" :class="{ on: item.favorito }" title="Favoritar" @click="item.favorito = !item.favorito">♥</button>
          <button class="remover" @click="remover(item.id)">✕</button>
        </li>
      </ul>
      <p v-else class="vazio">Nenhum título encontrado com esses filtros.</p>

      <div class="rodape">
        <button type="button" @click="sortear">🎲 Sortear o que assistir</button>
        <button type="button" @click="limparAssistidos" v-if="totalAssistidos">Limpar assistidos</button>
      </div>
      <p class="vazio" v-if="sorteado">&gt; sugestão: <b style="color:var(--cyan)">{{ sorteado }}</b></p>
    </template>
    <p v-else class="vazio">Nada para assistir por enquanto!</p>
    <div class="rodape dados">
      <button type="button" class="dica" @click="exportar"
        data-tip="Baixa a lista atual em um arquivo .json, no mesmo formato aceito pela importação.&#10;Campos: id, nome, tipo, assistido, favorito, nota.&#10;Edite no editor de texto e importe de volta.">⬇ Exportar JSON</button>
      <button type="button" class="dica" @click="$refs.arquivo.click()"
        data-tip="Aceita um .json com uma lista de objetos:&#10;[{ &quot;nome&quot;: &quot;Matrix&quot;,&#10;&nbsp;&quot;tipo&quot;: &quot;Filme&quot; ou &quot;Série&quot;,&#10;&nbsp;&quot;assistido&quot;: true/false,&#10;&nbsp;&quot;favorito&quot;: true/false,&#10;&nbsp;&quot;nota&quot;: 0 a 5 }]&#10;Só &quot;nome&quot; é obrigatório. Substitui a lista atual.">⬆ Importar JSON</button>
    </div>
    <input ref="arquivo" type="file" accept="application/json" hidden @change="importar" />
  </div>

  <script>
    const { createApp, ref, computed, watch } = Vue;
    const CHAVE = 'blockbuster-net:v1';

    function carregar() {
      try { return JSON.parse(localStorage.getItem(CHAVE)); } catch { return null; }
    }

    createApp({
      setup() {
        const titulo = ref('Minha lista de filmes e séries');
        const autor = ref('Gabriel Andrade');
        const novoNome = ref('');
        const novoTipo = ref('Filme');
        const salvo = carregar();
        const itens = ref(salvo || [
          { id: 1, nome: 'Blade Runner 2049', tipo: 'Filme', assistido: true, favorito: true },
          { id: 2, nome: 'Severance', tipo: 'Série', assistido: false, favorito: false },
          { id: 3, nome: 'Matrix', tipo: 'Filme', assistido: false, favorito: false },
        ]);
        itens.value.forEach(i => { i.nota ??= 0; i.favorito ??= false; });
        const proximoId = ref(Math.max(0, ...itens.value.map(i => i.id)) + 1);

        const busca = ref('');
        const filtroTipo = ref('');
        const filtroStatus = ref('todos');
        const sorteado = ref('');
        const abas = [
          { valor: 'todos', rotulo: 'Todos' },
          { valor: 'pendentes', rotulo: 'Pendentes' },
          { valor: 'assistidos', rotulo: 'Assistidos' },
          { valor: 'favoritos', rotulo: '♥' },
        ];
        const ordem = ref('adicao');
        const editandoId = ref(null);
        const editandoNome = ref('');
        const arquivo = ref(null);

        const visiveis = computed(() => {
          const lista = itens.value.filter(i => {
            if (filtroTipo.value && i.tipo !== filtroTipo.value) return false;
            if (filtroStatus.value === 'pendentes' && i.assistido) return false;
            if (filtroStatus.value === 'assistidos' && !i.assistido) return false;
            if (filtroStatus.value === 'favoritos' && !i.favorito) return false;
            return i.nome.toLowerCase().includes(busca.value.trim().toLowerCase());
          });
          if (ordem.value === 'az') lista.sort((a, b) => a.nome.localeCompare(b.nome));
          if (ordem.value === 'nota') lista.sort((a, b) => b.nota - a.nota);
          return lista;
        });
        const totalAssistidos = computed(() => itens.value.filter(i => i.assistido).length);
        const progresso = computed(() =>
          itens.value.length ? Math.round(totalAssistidos.value / itens.value.length * 100) : 0);

        watch(itens, v => {
          try { localStorage.setItem(CHAVE, JSON.stringify(v)); } catch {}
        }, { deep: true });

        function adicionar() {
          const nome = novoNome.value.trim();
          if (!nome) return;
          itens.value.push({ id: proximoId.value++, nome, tipo: novoTipo.value, assistido: false, favorito: false, nota: 0 });
          novoNome.value = '';
        }

        function editar(item) {
          editandoId.value = item.id;
          editandoNome.value = item.nome;
        }

        function salvarEdicao(item) {
          if (editandoId.value !== item.id) return;
          const nome = editandoNome.value.trim();
          if (nome) item.nome = nome;
          editandoId.value = null;
        }

        function exportar() {
          const blob = new Blob([JSON.stringify(itens.value, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'blockbuster-net.json';
          a.click();
          URL.revokeObjectURL(a.href);
        }

        function importar(e) {
          const f = e.target.files[0];
          if (!f) return;
          const leitor = new FileReader();
          leitor.onload = () => {
            try {
              const dados = JSON.parse(leitor.result);
              if (!Array.isArray(dados)) throw new Error();
              itens.value = dados
                .filter(d => d && typeof d.nome === 'string' && d.nome.trim())
                .map((d, idx) => ({
                  id: idx + 1, nome: d.nome.trim(),
                  tipo: d.tipo === 'Série' ? 'Série' : 'Filme',
                  assistido: !!d.assistido, favorito: !!d.favorito,
                  nota: Math.min(5, Math.max(0, Number(d.nota) || 0)),
                }));
              proximoId.value = itens.value.length + 1;
            } catch { alert('Arquivo inválido.'); }
            e.target.value = '';
          };
          leitor.readAsText(f);
        }

        function remover(id) {
          itens.value = itens.value.filter(i => i.id !== id);
        }

        function limparAssistidos() {
          itens.value = itens.value.filter(i => !i.assistido);
        }

        function sortear() {
          const pendentes = itens.value.filter(i => !i.assistido);
          sorteado.value = pendentes.length
            ? pendentes[Math.floor(Math.random() * pendentes.length)].nome
            : 'tudo assistido! 🎉';
        }

        return {
          titulo, autor, novoNome, novoTipo, itens, adicionar, remover,
          busca, filtroTipo, filtroStatus, abas, visiveis, totalAssistidos,
          progresso, limparAssistidos, sortear, sorteado,
          ordem, editandoId, editandoNome, editar, salvarEdicao, exportar, importar, arquivo,
        };
      },
    }).mount('#app');
  </script>
</body>
</html>
